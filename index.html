<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natal das Cria — Amigo Esmalte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Estilo inspirado na loja online (fundo cinza-claro, cartões brancos arredondados, tipografia do sistema) */
:root{
  --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --gray:#6e6e73; --line:#d2d2d7;
  --accent:#810831; --blue:#810831; --blue-h:#940a39; --green:#1d8a3a; --soft:#e8e8ed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.47;letter-spacing:-.022em;min-height:100vh}
#snow{display:none}
.wrap{max-width:560px;margin:0 auto;padding:44px 20px 80px}
.hide{display:none!important}

/* topo */
.logo{margin:0 0 34px}
.logo .top{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.logo h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:48px;line-height:1.05;font-weight:600;letter-spacing:-.015em;margin:0;color:var(--accent)}
.logo p{margin:10px 0 0;font-size:24px;line-height:1.17;font-weight:600;letter-spacing:.009em;color:var(--gray)}

/* cartões */
.card{background:var(--card);border-radius:28px;padding:28px 24px;margin-bottom:20px;box-shadow:2px 4px 12px rgba(0,0,0,.08)}
h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:28px;line-height:1.14;font-weight:600;letter-spacing:.007em;margin:0 0 8px;color:var(--ink)}
.explain{font-size:17px;color:var(--gray);margin:0 0 18px}
.explain b{color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* campos */
textarea,input{width:100%;font:inherit;font-size:17px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);resize:vertical}
textarea{min-height:58px;height:58px;resize:none;overflow:hidden;line-height:24px;padding:16px 18px;display:block}
textarea:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(129,8,49,.15)}

/* botões em pílula */
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:980px;padding:17px 24px;margin-top:16px;
  font:inherit;font-size:17px;font-weight:500;letter-spacing:-.022em;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;transition:background .2s,transform .1s}
.btn:hover{background:var(--blue-h)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:var(--accent)}
.btn.red:hover{background:#9a0a3b}
.btn.white{background:var(--soft);color:var(--ink)}
.btn.white:hover{background:#dcdce1}
.btn.wa{background:#1fa855}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:17px;cursor:pointer;display:block;margin:22px auto 0;padding:6px}
.link:hover{text-decoration:underline}
.small{font:inherit;font-size:14px;color:var(--blue);background:none;border:0;cursor:pointer;padding:4px 0;white-space:nowrap}
.small:hover{text-decoration:underline}

/* lista de nomes */
.namebtns{display:grid;gap:12px}
.namebtn{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--bg);border-radius:18px;padding:18px;
  font:inherit;font-size:19px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:background .2s,transform .1s}
.namebtn:hover{background:var(--soft)}
.namebtn:active{transform:scale(.99)}
.namebtn .ico{font-size:26px}
.namebtn .st{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:0;padding:6px 12px;border-radius:980px;background:#fff;color:var(--gray)}
.namebtn.ok .st{background:var(--green);color:#fff}

/* progresso */
.bar{height:6px;background:var(--soft);border-radius:980px;overflow:hidden;margin:22px 0 8px}
.bar div{height:100%;background:var(--accent);border-radius:980px;transition:width .4s}

/* aviso de sorteio */
.banner{background:var(--card);border-radius:28px;padding:24px;margin-bottom:20px;box-shadow:2px 4px 12px rgba(0,0,0,.08);font-size:17px;color:var(--gray)}
.banner big{display:block;font-size:28px;line-height:1.14;font-weight:600;color:var(--accent);margin-bottom:6px}

/* janela */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:28px;max-width:420px;width:100%;padding:32px 24px 24px;text-align:center;max-height:92vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal .emoji{font-size:46px;line-height:1}
.modal h3{font-size:24px;line-height:1.17;font-weight:600;margin:12px 0 8px;color:var(--ink)}
.modal p{font-size:17px;color:var(--gray);margin:6px 0}
.modal p b{color:var(--ink);font-weight:600}
.big{font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.02em;color:var(--accent);margin:6px 0 10px;overflow-wrap:anywhere}
.wish{background:var(--bg);border-radius:18px;padding:16px 18px;text-align:left;margin-top:14px}
.wish b{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--gray);margin-bottom:6px}
.wish .txt{font-size:21px;font-weight:600;line-height:1.3;white-space:pre-wrap}

/* estados */
.warn{background:#fff4e5;color:#8a4b00;border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px;display:none}
.warn.on{display:block}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.loading{text-align:center;color:var(--gray);font-size:17px;padding:40px 0}
.spin{width:28px;height:28px;border:3px solid var(--soft);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;font-size:0}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal-btn{font-size:19px;padding:20px}

@media (max-width:420px){ .logo h1{font-size:40px} .logo p{font-size:21px} h2{font-size:24px} .card{padding:24px 20px} }
/* ===== Vidro (estilo "liquid glass") só nas barras e botões ===== */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(129,8,49,.22),transparent 70%),
             radial-gradient(35% 30% at 90% 25%,rgba(29,138,58,.14),transparent 70%),
             radial-gradient(40% 35% at 70% 95%,rgba(29,138,58,.16),transparent 70%),
             radial-gradient(30% 30% at 5% 80%,rgba(255,159,67,.14),transparent 70%)}
.glassbar{position:sticky;top:max(12px,env(safe-area-inset-top));z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:calc(100% - 32px);max-width:528px;margin:12px auto 0;padding:10px 10px 10px 22px;border-radius:999px;
  background:
    radial-gradient(140% 160% at 15% -20%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.3) 40%,rgba(255,255,255,0) 62%),
    radial-gradient(70% 140% at 50% 140%,rgba(129,8,49,.14),rgba(129,8,49,0) 65%),
    radial-gradient(50% 120% at 104% 50%,rgba(29,138,58,.10),rgba(29,138,58,0) 70%),
    linear-gradient(180deg,rgba(255,255,255,.4),rgba(215,215,226,.4));
  backdrop-filter:blur(26px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(220%) brightness(1.08);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 1px #fff,inset 0 -3px 6px rgba(0,0,0,.08),inset 3px 0 6px rgba(255,255,255,.5),inset -3px 0 6px rgba(255,255,255,.3),
    0 0 0 1px rgba(0,0,0,.07),0 4px 10px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.14)}
.glassbar::after{content:"";position:absolute;left:5%;right:5%;top:2px;height:46%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.glassbar b{position:relative;z-index:1;font-weight:700;font-size:19px;color:var(--accent);letter-spacing:-.02em}
.glassbar .gbtn{position:relative;z-index:1;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:9px 16px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(240,240,246,.45));border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.10)}
.wrap{padding-top:24px}

.btn,.btn.red,.btn.white,.btn.wa{position:relative;overflow:hidden;
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.12)}
.btn{color:var(--ink);font-weight:600;
  background:
    radial-gradient(140% 120% at 20% -10%,rgba(255,255,255,1) 0%,rgba(255,255,255,.35) 38%,rgba(255,255,255,0) 60%),
    radial-gradient(80% 120% at 50% 120%,rgba(129,8,49,.16),rgba(129,8,49,0) 65%),
    radial-gradient(60% 90% at 105% 50%,rgba(29,138,58,.10),rgba(29,138,58,0) 70%),
    linear-gradient(180deg,rgba(255,255,255,.35),rgba(210,210,222,.45));
  backdrop-filter:blur(24px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(24px) saturate(220%) brightness(1.08);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,1),
    inset 0 -3px 6px rgba(0,0,0,.10),
    inset 0 -1px 0 rgba(255,255,255,.7),
    inset 3px 0 6px rgba(255,255,255,.55),
    inset -3px 0 6px rgba(255,255,255,.35),
    inset 0 0 0 1px rgba(255,255,255,.35),
    0 0 0 1px rgba(0,0,0,.08),
    0 2px 4px rgba(0,0,0,.08),
    0 12px 30px rgba(0,0,0,.16)}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:scale(.97);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 8px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.14)}
.btn:not(.red):not(.wa):not(.white)::after{left:6%;right:6%;top:2px;height:48%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.15) 70%,rgba(255,255,255,0))}
.btn:not(.red):not(.wa):not(.white)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 60%);mix-blend-mode:overlay}
.btn.red{background:linear-gradient(180deg,rgba(160,20,70,.92),rgba(120,6,45,.9))}
.btn.red:hover{background:linear-gradient(180deg,rgba(175,30,80,.95),rgba(129,8,49,.92))}
.btn.wa{background:linear-gradient(180deg,rgba(45,190,105,.92),rgba(25,160,80,.9))}
.btn.white{background:rgba(255,255,255,.5);color:var(--ink);border-color:rgba(0,0,0,.06)}
.btn.white:hover{background:rgba(255,255,255,.7)}
.btn::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:45%;border-radius:980px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
.namebtn{background:rgba(245,245,247,.6);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(0,0,0,.06)}
.namebtn:hover{background:rgba(232,232,237,.7)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glassbar{background:rgba(255,255,255,.95)} .btn.white{background:var(--soft)} }

.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;overflow:hidden;background:var(--soft);box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.12)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.emo{font-size:60%;background:var(--bg)}
.namebtn .av{font-size:24px}
.love{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center;
  background:rgba(129,8,49,.55);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);color:#fff;cursor:pointer}
.love.on{display:flex;animation:fadein 1s ease}
.love .msg{font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.02em;animation:rise 1.4s cubic-bezier(.2,.9,.3,1) both .3s;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.lovepic{width:min(48vw,190px);aspect-ratio:540/630;object-fit:cover;border-radius:22px;margin-bottom:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.7);animation:rise 1.2s cubic-bezier(.2,.9,.3,1) both}
.love .av{margin-bottom:22px;animation:rise 1.2s cubic-bezier(.2,.9,.3,1) both;font-size:60px}
.love small{margin-top:28px;font-size:14px;opacity:.75;animation:fadein 1s both 2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
/* Todos os botões em Liquid Glass: os coloridos são vidro com tinta (vinho, verde, cinza) */
.btn.red,.btn.wa,.btn.white{
  backdrop-filter:blur(22px) saturate(200%);-webkit-backdrop-filter:blur(22px) saturate(200%);
  border:1px solid rgba(255,255,255,.28);filter:none;font-weight:600;letter-spacing:-.022em;
  transition:background .2s ease,transform .15s ease,box-shadow .2s ease;
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.45),
    inset 0 -1.5px 2px rgba(0,0,0,.18),
    inset 1.5px 0 2px rgba(255,255,255,.18),
    inset -1.5px 0 2px rgba(255,255,255,.12),
    0 0 0 .5px rgba(0,0,0,.12),
    0 8px 22px rgba(0,0,0,.16)}
.btn.red::before,.btn.wa::before,.btn.white::before{display:none}
.btn.red::after,.btn.wa::after,.btn.white::after{display:block;content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -30%,rgba(255,255,255,.38),rgba(255,255,255,0) 60%)}
.btn.red{color:#fff;background:linear-gradient(180deg,#c0174f,#9c0e3e)}
.btn.red:hover{background:linear-gradient(180deg,#cc1c57,#a81145)}
.btn.wa{color:#fff;background:linear-gradient(180deg,#24b35f,#178a47)}
.btn.wa:hover{background:linear-gradient(180deg,#2bbf67,#1a964e)}
.btn.white{color:var(--ink);border-color:rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(236,236,242,.7),rgba(222,222,230,.6));
  box-shadow:inset 0 1.5px 0 #fff,inset 0 -1.5px 2px rgba(0,0,0,.07),inset 1.5px 0 2px rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.10)}
.btn.white::after{background:radial-gradient(120% 90% at 50% -30%,rgba(255,255,255,.8),rgba(255,255,255,0) 60%)}
.btn.red:active,.btn.wa:active,.btn.white:active{transform:scale(.97)}
.reveal-btn{font-size:17px;padding:17px 24px}
/* Padrão profissional (estilo iOS): cor sólida e viva, vidro só como um contorno de luz fino. Sem degradê e sem faixa de brilho. */
.btn::before,.btn::after,.btn.red::after,.btn.wa::after,.btn.white::after,
.btn:not(.red):not(.wa):not(.white)::after,.btn:not(.red):not(.wa):not(.white)::before{display:none!important}
.btn,.btn.red,.btn.wa,.btn.white{border:0;filter:none;font-weight:600;transition:background .2s ease,transform .15s ease}
.btn.red{color:#fff;background:#b01245;backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px rgba(176,18,69,.28)}
.btn.red:hover{background:#c0174f}
.btn.wa{color:#fff;background:#1e9e55;backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px rgba(30,158,85,.25)}
.btn.wa:hover{background:#22ad5d}
.btn.white{color:var(--ink);background:rgba(232,232,237,.85);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.05)}
.btn.white:hover{background:rgba(222,222,228,.9)}
.btn:not(.red):not(.wa):not(.white){color:var(--ink);background:rgba(255,255,255,.62);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),inset 0 1px 0 #fff,0 0 0 .5px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.08)}
.btn:not(.red):not(.wa):not(.white):hover{background:rgba(255,255,255,.8)}
.btn:active,.btn.red:active,.btn.wa:active,.btn.white:active{transform:scale(.97)}
.glassbar::after{display:none}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<header class="glassbar"><span style="display:flex;flex-direction:column;line-height:1.1;position:relative;z-index:1"><b>🎄 Natal das Cria</b><small style="font-size:12px;font-weight:600;color:var(--gray);letter-spacing:.01em;margin-top:2px;padding-left:2px">Amigo esmalte</small></span><button class="gbtn" onclick="location.reload()">Atualizar</button></header>
<div class="wrap">

  <div class="loading" id="loading"><div class="spin">🎁</div><br>Carregando...</div>

  <!-- INÍCIO: escolher o nome -->
  <section id="home" class="hide">
    <div class="banner hide" id="drawnBanner"><big>Saiu o sorteio!</big></div>
    <div class="card">
      <h2 style="margin-bottom:16px">Quem é você?</h2><button class="hide" id="refresh"></button>
      <p class="explain hide" id="homeTxt">Toque no seu nome.</p>
      <div class="namebtns" id="names"></div>
      <div class="bar" style="margin-top:16px"><div id="prog"></div></div>
      <p class="explain hide" id="progTxt" style="margin:6px 0 0"></p>
    </div>
  </section>

  <!-- PESSOA -->
  <section id="me" class="hide">
    <div class="card" style="padding:16px 18px">
      <div class="row"><h2 id="hello" style="margin:0"></h2><button class="small" id="notMe">Não sou eu</button></div>
    </div>

    <div class="card hide" id="resCard" style="text-align:center">
      <h2 style="margin-bottom:4px">Saiu o sorteio!</h2>
      
      <button class="btn red reveal-btn" id="revealBtn">Ver quem eu tirei</button>
    </div>

    <div class="card">
      <h2 id="wishTitle" style="margin-bottom:14px">Qual esmalte você quer?</h2>
      <p class="explain hide" id="wishHint">Escreva o nome da cor e aperte <b>Salvar</b>.</p>
      <textarea id="wText" rows="1" placeholder="Ex.: vermelho ou Risqué vermelho"></textarea>
      <div id="pinBox" class="hide">
        <label for="pinNew" style="display:block;font-weight:600;margin:18px 0 6px">Crie uma senha de 4 números</label>
        <input id="pinNew" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password" style="letter-spacing:.4em;font-size:22px;text-align:center">
        
      </div>
      <button class="btn" id="wSave">Salvar</button>
      <div class="warn" id="ww"></div>
    </div>

    <div class="card hide" id="waitCard">
      <h2 style="font-size:1.2rem">Falta quem?</h2>
      <p class="explain" id="waitTxt"></p>
      <p class="explain">O sorteio sai <b>sozinho</b> quando todas salvarem. Depois é só voltar aqui.</p>
    </div>
    <button class="link" id="back">Voltar</button>
  </section>

  <section id="error" class="hide">
    <div class="card" style="text-align:center">
            <h2>Ops!</h2>
      <p class="explain" id="errTxt"></p>
      <button class="btn" onclick="location.reload()">Tentar de novo</button>
    </div>
  </section>
</div>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="love" id="love"></div>
<div id="testeBar" class="hide" style="position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(29,29,31,.86);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.25)">
  Modo teste <button id="zerarTeste" style="font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:7px 12px;background:#b01245;color:#fff;cursor:pointer">Zerar teste</button>
</div>
<canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25"></canvas>

<script>
/* =========================================================
   CONFIGURAÇÃO — mude aqui se precisar
   ========================================================= */
const PARTICIPANTES = ['Sofia Miranda', 'Sofia Esteves', 'Ana', 'Gabi'];
// Fotos: coloque os arquivos na pasta fotos/ do repositório. Se a foto não existir, aparece um emoji de Natal.
const FOTOS = {
  'Sofia Miranda': 'fotos/sofia-miranda-2.jpg',
  'Sofia Esteves': 'fotos/sofia-esteves.jpg',
  'Ana': 'fotos/ana.jpg',
  'Gabi': 'fotos/gabi.jpg'
};
// Mensagem especial que aparece depois que a pessoa vê quem tirou
const MENSAGENS = { 'Sofia Miranda': 'Te amo, meu amor.' };
// Como chamar a pessoa depois que ela entra
const APELIDOS = { 'Sofia Miranda': 'amor' };
const chamar = n => APELIDOS[n] || n;
const Chamar = n => { const c = chamar(n); return c.charAt(0).toUpperCase() + c.slice(1); };
const SEMENTE = 'natal-das-cria-bf3a5df74715';   // define o sorteio; trocar = sorteio diferente
// Endereço do Realtime Database do Firebase (aba Dados). Não precisa de chave: a segurança fica nas Regras.
const BANCO = 'https://natal-das-cria-default-rtdb.firebaseio.com';
// Modo teste: abra o site com #teste no fim do link. Grava em outro lugar do banco e tem botão para zerar.
const TESTE = location.hash === '#teste';
const RAIZ = TESTE ? '/natal-teste' : '/natal';
/* ========================================================= */

const SITE = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const ICONS = ['🎄','🎅','🎁','⭐','🔔','🦌'];
const icon = n => ICONS[PARTICIPANTES.indexOf(n) % ICONS.length];
// A Sofia Miranda vê a foto do casal; as outras veem a foto dela sozinha
const FOTO_PARA_ELA = { 'Sofia Miranda': 'fotos/sofia-miranda-2.jpg' };
const FOTO_PARA_OUTRAS = { 'Sofia Miranda': 'fotos/sofia-miranda-solo-2.jpg' };
// Página inicial (ninguém entrou) e a própria Sofia: foto do casal. Outra menina logada: foto dela sozinha.
const fotoDe = n => (me && me !== n && FOTO_PARA_OUTRAS[n]) || FOTO_PARA_ELA[n] || FOTOS[n];
const avatar = (n, size) => fotoDe(n)
  ? `<span class="av" style="width:${size}px;height:${size}px"><img src="${fotoDe(n)}" alt="" onerror="this.parentNode.textContent='${icon(n)}';this.parentNode.classList.add('emo')"></span>`
  : `<span class="av emo" style="width:${size}px;height:${size}px">${icon(n)}</span>`;
let wishes = {}, pins = {}, me = null;

/* ---------- util ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k, v){ if(TESTE) k = 'teste:' + k; try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
function warn(el, t){ el.textContent = t; el.classList.toggle('on', !!t); if(t){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
function show(id){ ['loading','home','me','error'].forEach(s => $('#'+s).classList.toggle('hide', s !== id)); $('.glassbar').classList.toggle('hide', id !== 'home'); window.scrollTo({top:0}); }
function busy(btn, on, txt){ if(on){ btn.dataset.t = btn.innerHTML; btn.innerHTML = txt; btn.disabled = true; } else { btn.innerHTML = btn.dataset.t; btn.disabled = false; } }
const wa = t => 'https://wa.me/?text=' + encodeURIComponent(t);
function modal(html){ $('#modal').innerHTML = html; $('#ov').classList.add('on'); }
function closeModal(){ $('#ov').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#ov').addEventListener('click', e => { if(e.target.id === 'ov' || e.target.hasAttribute('data-close')) closeModal(); });

/* ---------- banco ---------- */
class Negado extends Error{}
async function api(method, path, body){
  const url = BANCO.replace(/\/+$/, '') + RAIZ + path + '.json';
  let r;
  try{ r = await fetch(url, { method, cache:'no-store', headers: body !== undefined ? {'Content-Type':'application/json'} : {}, body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new Error('Sem internet ou o servidor não respondeu. Tenta de novo daqui a pouco.'); }
  if(r.status === 401 || r.status === 403) throw new Negado('Não foi permitido salvar.');
  if(!r.ok) throw new Error('Deu um erro no servidor (' + r.status + '). Tenta de novo.');
  return r.json();
}
const caminho = n => '/' + encodeURIComponent(n);
async function load(){ const o = await api('GET', '') || {}; wishes = o.wishes || {}; pins = o.pins || {}; }   // 1 acesso
async function saveWish(name, text, pinHash){
  if(pinHash && !pins[name]){
    try{ await api('PUT', '/pins' + caminho(name), pinHash); pins[name] = pinHash; }   // só na primeira vez
    catch(e){ if(e instanceof Negado){ await load(); return; } throw e; }               // alguém já criou senha pra esse nome
  }
  await api('PUT', '/wishes' + caminho(name), text);                                  // 1 acesso
  wishes[name] = text;
}
/* ---------- senha ---------- */
async function hashPin(name, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('natal-das-cria|' + name + '|' + pin));
  return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2,'0')).join('');
}
const unlocked = n => !pins[n] || ls('cria:pin:' + n) === pins[n];
function askPin(n, then){
  modal(`${avatar(n, 84)}<h3>Senha da ${esc(n)}</h3><p>Digite a senha de 4 números que você criou.</p>
    <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="current-password" style="letter-spacing:.4em;font-size:24px;text-align:center;margin-top:12px">
    <div class="warn" id="wpin"></div>
    <button class="btn" id="pinOk">Entrar</button>
    <button class="link" id="pinForgot">Esqueci a senha</button>`);
  const go = async () => {
    const v = $('#pinIn').value.trim();
    if(!/^[0-9]{4}$/.test(v)){ warn($('#wpin'), 'A senha tem 4 números.'); return; }
    const h = await hashPin(n, v);
    if(h !== pins[n]){ warn($('#wpin'), 'Senha errada. Tenta de novo.'); $('#pinIn').value = ''; $('#pinIn').focus(); return; }
    ls('cria:pin:' + n, h); closeModal(); then();
  };
  $('#pinOk').onclick = go;
  $('#pinIn').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } });
  $('#pinForgot').onclick = () => modal(`<h3>Esqueceu?</h3><p>Fala com o Marcelo que ele apaga sua senha e você cria outra.</p><button class="btn" data-close>Ok</button>`);
  setTimeout(() => $('#pinIn') && $('#pinIn').focus(), 200);
}

/* ---------- sorteio automático ----------
   Sempre dá o mesmo resultado (vem da SEMENTE), então não precisa de ninguém pra sortear:
   assim que todas salvam, cada celular calcula o mesmo sorteio. Ninguém tira a si mesma. */
function prng(seed){ let h = 1779033703 ^ seed.length; for(const c of seed){ h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function pairs(){
  const r = prng(SEMENTE + (TESTE ? '|teste' : '') + '|' + PARTICIPANTES.join('|'));
  const idx = PARTICIPANTES.map((_,i) => i);
  for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(r() * i); [idx[i], idx[j]] = [idx[j], idx[i]]; }  // Sattolo
  const out = {}; PARTICIPANTES.forEach((n,i) => out[n] = PARTICIPANTES[idx[i]]); return out;
}
const done = n => !!(wishes[n] && wishes[n].trim());
const allDone = () => PARTICIPANTES.every(done);
const missing = () => PARTICIPANTES.filter(n => !done(n));

/* ---------- início ---------- */
function renderHome(){
  const drawn = allDone(), d = PARTICIPANTES.filter(done).length;
  $('#drawnBanner').classList.toggle('hide', !drawn);
  $('#homeTxt').textContent = drawn ? 'Toque no seu nome pra ver o resultado.' : 'Toque no seu nome pra escrever o esmalte que você quer.';
  $('#names').innerHTML = PARTICIPANTES.map(n => `
    <button class="namebtn ${done(n) ? 'ok' : ''}" data-n="${esc(n)}">
      ${avatar(n, 44)}${esc(n)}
      <span class="st">${done(n) ? 'Pronto' : 'Falta'}</span>
    </button>`).join('');
  $('#prog').style.width = (d / PARTICIPANTES.length * 100) + '%';
  $('#progTxt').textContent = drawn ? 'Todas escolheram!' : `${d} de ${PARTICIPANTES.length} já escolheram`;
  show('home');
}
$('#names').addEventListener('click', e => {
  const b = e.target.closest('.namebtn'); if(!b) return;
  const n = b.dataset.n;
  const enterNow = () => { me = n; ls('cria:me', n); renderMe(); };
  if(pins[n]){ if(unlocked(n)) enterNow(); else askPin(n, enterNow); return; }   // já tem senha: vai direto
  modal(`${avatar(n, 84)}<h3>Você é a ${esc(n)}?</h3><p>Só toque em "Sou eu" se for você mesma!</p>
    <button class="btn" id="yesMe">Sou eu</button><button class="btn white" data-close>Não sou</button>`);
  $('#yesMe').onclick = () => {
    const enter = () => { me = n; ls('cria:me', n); renderMe(); };
    if(unlocked(n)){ closeModal(); enter(); } else askPin(n, enter);
  };
});
$('#refresh').onclick = async e => {
  busy(e.target, true, '...');
  try{ await load(); renderHome(); }catch(err){ modal(`<h3>Ops</h3><p>${esc(err.message)}</p><button class="btn" data-close>Ok</button>`); }
  busy(e.target, false);
};

/* ---------- pessoa ---------- */
function renderMe(){
  const drawn = allDone();
  $('#hello').innerHTML = `<span style="display:inline-flex;align-items:center;gap:12px">${avatar(me, 40)}Oi, ${esc(chamar(me))}!</span>`;
  $('#resCard').classList.toggle('hide', !drawn);
  $('#waitTxt').textContent = missing().length ? 'Ainda falta: ' + missing().join(', ') : '';
  $('#wText').value = wishes[me] || '';
  setTimeout(growText, 0);   // mede depois que a tela aparece
  $('#wishTitle').textContent = done(me) ? 'Seu esmalte' : 'Qual esmalte você quer?';
  $('#wishHint').innerHTML = done(me) ? 'Tudo salvo! Se quiser mudar, escreva e salve de novo.' : 'Escreva o nome da cor e aperte <b>Salvar</b>.';
  $('#wSave').textContent = done(me) ? 'Salvar mudança' : 'Salvar';
  $('#pinBox').classList.toggle('hide', !!pins[me]);
  $('#pinNew').value = '';
  show('me');
}
$('#wSave').onclick = async () => {
  const t = $('#wText').value.trim();
  if(!t){ warn($('#ww'), 'Escreva o nome da cor primeiro.'); $('#wText').focus(); return; }
  let pinHash = null;
  if(!pins[me]){
    const p = $('#pinNew').value.trim();
    if(!/^[0-9]{4}$/.test(p)){ warn($('#ww'), 'Crie uma senha com 4 números.'); $('#pinNew').focus(); return; }
    pinHash = await hashPin(me, p);
  }
  warn($('#ww'), ''); busy($('#wSave'), true, 'Salvando...');
  const wasDrawn = allDone();
  try{
    await saveWish(me, t, pinHash);
    if(pins[me] && pinHash && pins[me] !== pinHash){ renderMe(); busy($('#wSave'), false); me = null; ls('cria:me', null); renderHome();
      modal(`<h3>Alguém já criou senha pra esse nome</h3><p>Toque no seu nome de novo e use a senha.</p><button class="btn" data-close>Ok</button>`); return; }
    if(pins[me]) ls('cria:pin:' + me, pins[me]);
    renderMe();
    if(!wasDrawn && allDone()){
      modal(`<h3>Você foi a última!</h3><p>O sorteio <b>acabou de sair</b>. Avise as meninas no grupo:</p>
        <a class="btn wa" style="padding:16px;font-size:1.15rem" target="_blank" rel="noopener" href="${wa('🎄 NATAL DAS CRIA\n\nSAIU O SORTEIO DO AMIGO ESMALTE!\n\nEntra no site, toca no seu nome e depois em "Ver quem eu tirei"\n' + SITE)}">Avisar no grupo</a>
        <button class="btn red" id="seeNow">Ver quem eu tirei</button>`);
      $('#seeNow').onclick = reveal;
    } else if(!wasDrawn){
      modal(`<h3>Salvo!</h3><p>Agora é esperar as outras. O sorteio sai sozinho quando todas salvarem.</p>${missing().length ? `<p>Falta: <b>${esc(missing().join(', '))}</b></p>` : ''}<button class="btn" data-close>Ok</button>`);
    } else {
      modal(`<h3>Salvo!</h3><p>Quem te tirou já vai ver a mudança.</p><button class="btn" data-close>Ok</button>`);
    }
  }catch(e){ warn($('#ww'), e.message); }
  busy($('#wSave'), false);
};
function reveal(){
  const t = pairs()[me];
  setTimeout(confetti, 150);
  modal(`${avatar(t, 96)}<p style="margin-top:14px">${esc(Chamar(me))}, você tirou:</p><div class="big">${esc(t)}</div>
    <div class="wish"><b>O esmalte que ela quer:</b><div class="txt">${esc(wishes[t] || '—')}</div></div>
    <p style="margin-top:12px">Não conta pra ninguém!</p>
    <button class="btn${MENSAGENS[me] ? ' red' : ''}" id="closeReveal">${MENSAGENS[me] ? 'Ver surpresa' : 'Fechar'}</button>`);
  $('#closeReveal').onclick = () => { closeModal(); if(MENSAGENS[me]) showLove(); };
}
/* ---------- confete na revelação ---------- */
function confetti(){
  const c = $('#confetti'), x = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const cores = ['#b01245','#d6336c','#1e9e55','#34c26f','#e6b422','#ffffff'];
  const ps = [];
  const burst = (ox, dir) => { for(let i = 0; i < 90; i++){
    const a = (dir === 0 ? -Math.PI/2 : dir < 0 ? -Math.PI/3 : -2*Math.PI/3) + (Math.random()-.5) * 1.1, v = 9 + Math.random() * 9;
    ps.push({ x:ox, y:H*0.62, vx:Math.cos(a)*v, vy:Math.sin(a)*v, w:6+Math.random()*6, h:8+Math.random()*10,
      r:Math.random()*6.3, vr:(Math.random()-.5)*.35, c:cores[Math.random()*cores.length|0], t:0, circle:Math.random()<.25 }); } };
  burst(W*0.1, -1); burst(W*0.9, 1); setTimeout(() => burst(W*0.5, 0), 180);
  const t0 = performance.now();
  (function tick(now){
    x.clearRect(0,0,W,H);
    for(const p of ps){ p.vy += .32; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.t++;
      const life = Math.max(0, 1 - (now - t0) / 3800); x.globalAlpha = life;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if(p.circle){ x.beginPath(); x.arc(0,0,p.w/2,0,6.3); x.fill(); } else { x.scale(1, Math.cos(p.t*.12)); x.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
      x.restore(); }
    if(now - t0 < 3800) requestAnimationFrame(tick); else x.clearRect(0,0,W,H);
  })(t0);
}
function showLove(){
  const el = $('#love');
  el.innerHTML = `${avatar(me, 120)}<div class="msg">${esc(MENSAGENS[me])}</div>`;
  el.classList.add('on');
  el.onclick = () => el.classList.remove('on');
}
$('#revealBtn').onclick = async () => {
  modal(`<h3>Tem alguém olhando?</h3><p>${APELIDOS[me] ? `Só aperte se estiver sozinha, <b>${esc(chamar(me))}</b>!` : `Só aperte se você for a <b>${esc(me)}</b> e estiver sozinha!`}</p>
    ${MENSAGENS[me] ? `<div class="wish" style="text-align:center;margin-top:16px;background:rgba(129,8,49,.08)"><div class="txt" style="color:var(--accent)">🎁 Tem uma surpresa pra você!</div><p style="margin:6px 0 0">Depois de ver quem você tirou, ela vai aparecer.</p></div>` : ''}
    <button class="btn red" id="goReveal">Mostrar</button><button class="btn white" data-close>Espera</button>`);
  $('#goReveal').onclick = () => reveal();   // usa os dados já carregados, sem novo acesso
};
$('#notMe').onclick = () => { if(me) ls('cria:pin:' + me, null); me = null; ls('cria:me', null); renderHome(); };
$('#back').onclick = renderHome;

/* ---------- neve ---------- */
(function(){
  const c = $('#snow'), x = c.getContext('2d'); let W, H, f = [];
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  size(); addEventListener('resize', size);
  for(let i = 0; i < 70; i++) f.push({ x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*3, s:.4+Math.random()*1.2, d:Math.random()*6 });
  (function tick(){ x.clearRect(0,0,W,H); x.fillStyle = 'rgba(255,255,255,.85)';
    for(const p of f){ p.y += p.s; p.d += .02; p.x += Math.sin(p.d)*.4; if(p.y > H){ p.y = -5; p.x = Math.random()*W; } x.beginPath(); x.arc(p.x,p.y,p.r,0,6.3); x.fill(); }
    requestAnimationFrame(tick); })();
})();

/* ---------- modo teste ---------- */
addEventListener('hashchange', () => location.reload());   // trocar entre #teste e o normal recarrega
if(TESTE){
  $('#testeBar').classList.remove('hide');
  $('#zerarTeste').onclick = async () => {
    try{ await api('DELETE', ''); }catch(e){ modal(`<h3>Ops</h3><p>${esc(e.message)}</p><button class="btn" data-close>Ok</button>`); return; }
    try{ Object.keys(localStorage).filter(k => k.startsWith('teste:')).forEach(k => localStorage.removeItem(k)); }catch(e){}
    location.reload();
  };
}

/* ---------- campo que cresce conforme escreve ---------- */
function growText(){ const t = $('#wText'); t.style.height = '58px'; t.style.height = Math.max(58, t.scrollHeight) + 'px'; }
$('#wText').addEventListener('input', growText);

/* ---------- começar ---------- */
(async () => {
  try{
    await load();
    const saved = ls('cria:me');
    if(saved && PARTICIPANTES.includes(saved) && unlocked(saved)){ me = saved; renderMe(); } else renderHome();
  }catch(e){ $('#errTxt').textContent = e.message; show('error'); }
})();
</script>
</body>
</html>
